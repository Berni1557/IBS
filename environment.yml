name: ibs

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pip>=23.3
  - setuptools>=67.8
  - wheel
  - numpy=1.26.4
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=11.8
  - pip:
      # Install the repository's modified nnU-Net snapshot and its declared
      # dependencies. Run `conda env create` from the repository root.
      - -e ./src/tools/nnUNet/nnUNet
      - h5py==3.10.0
      - imbalanced-learn==0.12.4
      - imutils==0.5.4
      - keyboard==0.13.5
      - kneed==0.8.5
      - nngeometry==0.2.2
      - opencv-python==4.10.0.84
      - pingouin==0.5.4
      - pynrrd==1.0.0
      - submodlib
      - tables==3.9.2
      - torchcontrib==0.0.2
      - torchmetrics==1.3.2
      - umap-learn==0.5.6
      - xgboost==2.0.3

